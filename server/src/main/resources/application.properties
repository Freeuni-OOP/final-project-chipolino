spring.application.name=RoadReport

spring.datasource.url=jdbc:mysql://roadreport-db:3306/roadreport?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

graphhopper.osm-file=/app/data/georgia-260525.osm.pbf
graphhopper.graph-cache=data/graphhopper-cache

application.security.jwt.secret-key= ${JWT_SECRET_KEY}
application.security.jwt.expiration = ${JWT_EXPIRATION}
