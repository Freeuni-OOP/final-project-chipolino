spring.application.name=RoadReport

spring.datasource.url=jdbc:mysql://localhost:3306/road_report_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

graphhopper.osm-file=server/data/georgia-260525.osm.pbf
graphhopper.graph-cache=data/graphhopper-cache

application.security.jwt.secret-key= ${JWT_SECRET_KEY}
application.security.jwt.expiration = ${JWT_EXPIRATION}