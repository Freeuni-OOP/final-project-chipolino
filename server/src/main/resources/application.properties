spring.application.name=RoadReport

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

graphhopper.osm-file=${OSM_FILE_PATH:server/data/georgia-260525.osm.pbf}
graphhopper.graph-cache=server/data/graphhopper-cache

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

brevo.api.key=${BREVO_API_KEY}
app.frontend.url=${FRONTEND_URL}
sender=${SENDER_EMAIL}

