services:
  backend:
    build: ./server
    container_name: roadreport-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "8082:8080"
    volumes:
      - ./server/data:/app/data

  frontend:
    build: ./web
    container_name: roadreport-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/localhost.pem:/etc/nginx/certs/nginx.crt:ro
      - ./web/localhost-key.pem:/etc/nginx/certs/nginx.key:ro
    depends_on:
      - backend
